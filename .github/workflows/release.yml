name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish npm package and GitHub release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: >-
          node --input-type=module --eval
          "import packageJson from './package.json' with { type: 'json' };
          if (process.env.GITHUB_REF_NAME !== 'v' + packageJson.version)
          throw new Error('Tag ' + process.env.GITHUB_REF_NAME +
          ' does not match package version v' + packageJson.version)"

      - name: Check package
        run: npm run check

      - name: Publish npm package
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
